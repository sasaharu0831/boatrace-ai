name: One-time B-only third-place redundancy Oct01-03
on:
  pull_request:
    paths:
      - '.github/workflows/third-place-oct01-03.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oct01-03-b-only-third-redundancy-once
  cancel-in-progress: true
jobs:
  historical_trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prevent repeated official requests
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$(git log -1 --pretty=%s)" = "Run one-time third-place redundancy Oct01-03 holdout" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Manual or one-time commit only; no network."
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Offline unit tests
        if: steps.gate.outputs.enabled == 'true'
        run: python -W error -m unittest discover -s tests -v
      - name: Free p7zip decompressor
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Slow bounded official download six historical B and K
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python src/boat_free_lab.py collect --start 2026-10-01 --days 3 --root "$RUNNER_TEMP/third-trial" --sleep 2
      - name: Freeze tickets before K and score research only
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python src/third_place_trial.py --root "$RUNNER_TEMP/third-trial" --dates 2026-10-01 2026-10-02 2026-10-03 > "$RUNNER_TEMP/report.json"
          python - <<'PY'
          import json,os
          result=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"report.json"),encoding="utf-8"))
          assert result["mode"]=="B_ONLY_THIRD_REDUNDANCY_HISTORICAL_NOT_FORWARD"
          assert result["forward_verified_races"]==0 and result["model_promotion"] is False
          print("TRIAL_DAYS",json.dumps([{
              "date":d["date"],"B_sha":d["B_sha256"],"K_sha":d["K_sha256"],
              "ticket_sha":d["B_ticket_sha256"],"B_frozen":d["B_frozen_races"],
              "races":d["results"]["baseline_local_motor"]["races"]}
              for d in result["per_day"]],sort_keys=True))
          for name,s in result["aggregate"].items():
              assert s["races"]>0 and s["stakes_yen"] == 800*s["races"]
              assert sum(s["misses"].values())==s["races"]
              assert s["misses"]["EXACT_HIT"]==s["hits"]
              print("TRIAL_POLICY",json.dumps({"policy":name,**s},sort_keys=True))
          PY
      - name: No persistent official raw upload
        if: always()
        run: echo "No raw official B or K exported; historical aggregate in CI log only. No production change."
