name: Historical B-only Oct15-17 miss decomposition
on:
  pull_request:
    paths:
      - '.github/workflows/oct15-17-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oct15-17-miss-decomposition-once
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restrict external download to explicit one-time commit
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$(git log -1 --pretty=%s)" = "Run one-time Oct15-17 frozen B-only miss audit" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "No network requests for follow-on PR revisions."
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.allowed == 'true'
        with:
          python-version: '3.12'
      - name: Run offline safety tests
        if: steps.gate.outputs.allowed == 'true'
        run: python -W error -m unittest discover -s tests -v
      - name: Install free LZH decompressor
        if: steps.gate.outputs.allowed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
      - name: Bounded one-time six-file official retrieval
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python src/boat_free_lab.py collect --start 2026-10-15 --days 3 --root "$RUNNER_TEMP/diag" --sleep 2
      - name: B-only freeze, K-only score and exclusive miss reasons
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python src/holdout_analysis.py --root "$RUNNER_TEMP/diag" --dates 2026-10-15 2026-10-16 2026-10-17 > "$RUNNER_TEMP/result.json"
          python - <<'PY'
          import json, os
          path=os.path.join(os.environ["RUNNER_TEMP"],"result.json")
          data=json.load(open(path,encoding="utf-8"))
          assert data["mode"]=="HISTORICAL_OOS_SHADOW_NOT_FORWARD"
          assert data["forward_verified_races"] == 0 and data["production_models_promoted"]==0
          days=[{"date":r["date"],"B_sha":r["B_archive_sha256"],"K_sha":r["K_archive_sha256"],"ticket_sha":r["B_ticket_sha256"],"B_races":r["B_races"],"K_races":r["K_races"],"joined":r["historical_joined"],"K_marker_count":r["K_positive_marker_races_in_joined"]} for r in data["per_day"]]
          assert len(days)==3 and all(d["joined"]>0 for d in days)
          print("DAY_SUMMARY",json.dumps(days,sort_keys=True))
          for name,groups in data["aggregate"].items():
              overall=groups["overall"]
              reasons=data["miss_diagnostics"][name]["overall"]
              assert sum(reasons.values())==overall["races"]
              assert reasons["EXACT_HIT"]==overall["hits"]
              print("POLICY_SUMMARY",json.dumps({"policy":name,"overall":overall,"misses":reasons,"stage":{k:v for k,v in groups.items() if k.startswith("stage:")},"venue":{k:v for k,v in groups.items() if k.startswith("venue:")},"K_marker":{k:v for k,v in groups.items() if k.startswith("marker:")}},sort_keys=True))
          PY
      - name: No upload of raw B/K or SQLite and no model promotion
        if: always()
        run: echo "Only historical aggregate log. No raw B/K upload; no production action."
